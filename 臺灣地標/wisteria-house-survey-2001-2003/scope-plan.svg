<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#faf8f0"/><g font-family="sans-serif" fill="#26322b"><text x="30" y="36" font-size="25">紫藤廬｜修復前測繪外殼研究範圍</text><text x="30" y="65" font-size="15">作者重繪近似位置示意，不是原測繪圖；北向上，西向左。圍牆、庭園、室內不建。</text><rect x="144.89999999999998" y="365.05" width="358.04999999999995" height="168.95000000000002" fill="#d1c8b2" stroke="#48544d" stroke-width="2"/><text x="323.92499999999995" y="449.52500000000003" text-anchor="middle" font-size="15">西木造低屋</text><rect x="378.95" y="224" width="212.35000000000005" height="171.74" fill="#d1c8b2" stroke="#48544d" stroke-width="2"/><text x="485.125" y="309.87" text-anchor="middle" font-size="15">舊中廳/廊</text><rect x="591.3000000000001" y="251.9" width="230.95" height="175.14999999999998" fill="#b2c1cd" stroke="#48544d" stroke-width="2"/><text x="706.7750000000001" y="339.475" text-anchor="middle" font-size="15">東二層主廳</text><rect x="822.25" y="327.85" width="159.64999999999995" height="164.3" fill="#b2c1cd" stroke="#48544d" stroke-width="2"/><text x="902.0749999999999" y="410.0" text-anchor="middle" font-size="15">入口/上房</text><rect x="822.25" y="117.05000000000003" width="159.64999999999995" height="210.79999999999995" fill="#c7d8ba" stroke="#48544d" stroke-width="2"/><text x="902.0749999999999" y="222.45" text-anchor="middle" font-size="15">低花廳</text><rect x="89.1" y="127.9" width="289.84999999999997" height="237.14999999999998" fill="#c7d8ba" stroke="#48544d" stroke-width="2"/><text x="234.02499999999998" y="246.475" text-anchor="middle" font-size="15">服務屋</text><rect x="378.95" y="117.05000000000003" width="212.35000000000005" height="106.94999999999997" fill="#c7d8ba" stroke="#48544d" stroke-width="2"/><text x="485.125" y="170.525" text-anchor="middle" font-size="15">北茶房/梯間</text><rect x="608.35" y="172.85" width="113.14999999999995" height="79.05000000000003" fill="#d1c8b2" stroke="#48544d" stroke-width="2"/><text x="664.925" y="212.375" text-anchor="middle" font-size="15">紫青房</text><text x="40" y="580" font-size="16">圖面控制：低屋脊約5.17m／高屋脊約8.56m；原平面、天花圖之水平尺寸鏈校核屋段。</text><text x="40" y="610" font-size="16">非2008或2026修後現況；局部附屋、接縫、GL／地坪差與屋頂收邊皆保留估配限制。</text></g></svg>